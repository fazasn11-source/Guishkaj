name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle (if no wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.6'

      - name: Find project directory
        id: findproj
        run: |
          # Найти первую папку с build.gradle.kts или build.gradle
          proj=$(find . -maxdepth 3 -type f \( -name 'build.gradle.kts' -o -name 'build.gradle' \) | head -n1)
          if [ -z "$proj" ]; then
            echo "NO_PROJECT=1" >> $GITHUB_ENV
            echo "No build.gradle(.kts) found"
            exit 1
          fi
          projdir=$(dirname "$proj")
          echo "PROJECT_DIR=$projdir" >> $GITHUB_ENV
          echo "Found project dir: $projdir"
      - name: Show project dir (debug)
        run: |
          echo "PROJECT_DIR=${PROJECT_DIR}"
          ls -la "${PROJECT_DIR}"

      - name: Build (use wrapper if present, otherwise gradle)
        run: |
          if [ -f "${PROJECT_DIR}/gradlew" ]; then
            chmod +x "${PROJECT_DIR}/gradlew"
            "${PROJECT_DIR}/gradlew" build --no-daemon --info --stacktrace
          else
            gradle -p "${PROJECT_DIR}" build --no-daemon --info --stacktrace
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: guishkaj-jar
          path: '**/build/libs/*.jar'
